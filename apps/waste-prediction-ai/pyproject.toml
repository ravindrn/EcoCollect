[project]
name = "waste-prediction-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "scikit-learn==1.6.1",
    "sqlalchemy>=2.1.8",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
waste-prediction-api = "waste_prediction_api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
